<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lamelle 3D · Painel operacional</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Karla:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{--paper:#f7f3ed;--paper2:#efe9e0;--paper3:#e4dcd1;--copper:#b0785c;--copper2:#d9b49c;--sage:#8d9b80;--sage2:#c3cbba;--ink:#33302e;--muted:#6e6862;--line:#dcd3c7;--danger:#a8574a;--white:#fffdfa;--display:"Bodoni Moda",Georgia,serif;--body:"Karla",Arial,sans-serif;--mono:"IBM Plex Mono",monospace}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--body);background-image:radial-gradient(circle at 10% 10%,#d9b49c1a,transparent 38%),radial-gradient(circle at 90% 75%,#8d9b801a,transparent 42%)}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}*:focus-visible{outline:2px solid var(--copper);outline-offset:2px}.app{max-width:1440px;margin:auto;padding:0 24px 64px}
header{display:grid;grid-template-columns:minmax(240px,1fr) auto;gap:28px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}.brand{display:flex;gap:18px;align-items:center}.brand img{width:178px;height:92px;object-fit:cover;object-position:center;border:1px solid var(--line);border-radius:3px;mix-blend-mode:multiply}.brand h1{font:500 29px/1 var(--display);letter-spacing:.08em;margin:0}.eyebrow,.label,th{font:10px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.brand p{margin:7px 0 0;color:var(--muted)}
.layer-wrap{display:flex;gap:16px;align-items:end}.layers{width:88px;display:flex;flex-direction:column-reverse;gap:2px}.layer{height:3px;background:var(--paper3);margin:auto;border-radius:1px}.layer.on{background:var(--copper)}.layer.top{background:var(--sage)}.layer-number{font:25px/1 var(--mono);color:var(--copper)}
nav{display:flex;gap:2px;overflow:auto;border-bottom:1px solid var(--line);position:sticky;top:0;background:#f7f3edf2;backdrop-filter:blur(12px);z-index:8}nav button{flex:0 0 auto;border:0;border-bottom:2px solid transparent;background:none;padding:14px 12px;font:10px var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}nav button.active{color:var(--copper);border-color:var(--copper)}main{padding-top:28px}.page-head{display:flex;gap:20px;align-items:end;justify-content:space-between;margin-bottom:22px}.page-head h2{font:400 31px/1.15 var(--display);margin:0}.page-head p{color:var(--muted);margin:6px 0 0;max-width:65ch}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(5,1fr);margin-bottom:24px}.cols2{grid-template-columns:1.3fr .7fr}.card{background:var(--white);border:1px solid var(--line);border-radius:3px;padding:19px}.card h3{font:400 20px var(--display);margin:0 0 4px}.kpi strong{display:block;font:26px var(--mono);font-weight:400}.kpi span{display:block;margin-top:7px}.kpi.warn{border-left:3px solid var(--danger)}.bar{height:4px;background:var(--paper3);margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--copper)}
.btn{border:0;background:var(--copper);color:white;padding:10px 15px;border-radius:2px;font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase}.btn:hover{background:#98634b}.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:var(--danger)}.actions{display:flex;gap:8px;flex-wrap:wrap}.iconbtn{border:1px solid var(--line);background:white;padding:5px 8px;border-radius:2px}.tag{display:inline-block;padding:4px 7px;border-radius:2px;background:var(--paper2);font:9px var(--mono);letter-spacing:.08em;text-transform:uppercase}.tag.ok{background:var(--sage2)}.tag.warn{background:#efd5d0}.tag.copper{background:var(--copper2)}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th{text-align:left;border-bottom:1px solid var(--line);padding:8px}td{padding:12px 8px;border-bottom:1px solid var(--paper2);vertical-align:top}.num{text-align:right;font-family:var(--mono)}.empty{border:1px dashed var(--line);padding:34px;text-align:center;color:var(--muted)}.empty strong{display:block;font:19px var(--display);color:var(--ink)}
dialog{border:1px solid var(--line);border-radius:4px;background:var(--paper);padding:0;width:min(760px,calc(100vw - 30px));max-height:90vh;color:var(--ink)}dialog::backdrop{background:#332f2b99;backdrop-filter:blur(3px)}.modal-head,.modal-foot{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-foot{border:0;border-top:1px solid var(--line);justify-content:flex-end}.modal-head h3{font:23px var(--display);margin:0}.modal-body{padding:22px;overflow:auto;max-height:65vh}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.field.full{grid-column:1/-1}.field label{display:block;margin-bottom:6px;font:9px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);background:white;border-radius:2px;padding:9px 10px}textarea{min-height:75px}.notice{padding:12px 14px;background:#8d9b8012;border-left:2px solid var(--sage);margin:12px 0}.order-line{display:grid;grid-template-columns:2fr .7fr .9fr auto;gap:8px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}
.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:2px;font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:20}.toast.show{opacity:1;transform:none}.quick{display:grid;gap:9px}.quick button{text-align:left;border:1px solid var(--line);background:white;padding:12px}.quick small{display:block;color:var(--muted)}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}.cols2{grid-template-columns:1fr}}@media(max-width:700px){.app{padding:0 14px 50px}header{grid-template-columns:1fr}.brand img{width:130px;height:72px}.layer-wrap{display:none}.kpis{grid-template-columns:1fr 1fr}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.page-head{align-items:start;flex-direction:column}.order-line{grid-template-columns:1fr 1fr}.order-line .product{grid-column:1/-1}}@media(max-width:420px){.kpis{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
(function(root,factory){
  const api=factory();
  if(typeof module==='object'&&module.exports) module.exports=api;
  root.LamelleCore=api;
})(typeof globalThis!=='undefined'?globalThis:this,function(){
  'use strict';
  const n=v=>Number.isFinite(Number(v))?Number(v):0;
  const money=v=>Math.round((n(v)+Number.EPSILON)*100)/100;
  const uid=p=>(p||'id')+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);

  function priceProduct(p={},s={}){
    const filament=n(p.grams)/1000*n(s.filamentKgPrice);
    const hours=n(p.printMinutes)/60;
    const energy=hours*0.15*n(s.kwhRate);
    const depreciation=hours*(n(s.printerValue)/(n(s.printerLifeHours)||2000));
    const failureReserve=(filament+energy+depreciation)*0.10;
    const labor=n(p.workMinutes)/60*n(s.laborHour);
    const totalCost=filament+energy+depreciation+failureReserve+labor+n(p.supplies)+n(p.packaging);
    return {filament:money(filament),energy:money(energy),depreciation:money(depreciation),failureReserve:money(failureReserve),labor:money(labor),totalCost:money(totalCost),salePrice:money(totalCost*(n(p.multiplier)||n(s.defaultMultiplier)||3)),margin:totalCost?money((1-totalCost/(totalCost*(n(p.multiplier)||n(s.defaultMultiplier)||3)))*100):0};
  }

  function volumeRate(q,individualized){ if(individualized)return 0; q=n(q); return q>=60?.20:q>=30?.15:q>=10?.10:0; }
  function orderTotals(items=[],paid=0){
    let gross=0,discount=0,cost=0;
    items.forEach(i=>{const q=Math.max(0,n(i.quantity));const subtotal=q*n(i.unitPrice);gross+=subtotal;discount+=subtotal*volumeRate(q,!!i.individualized);cost+=q*n(i.unitCost);});
    const total=gross-discount;
    return {gross:money(gross),discount:money(discount),total:money(total),cost:money(cost),profit:money(total-cost),minimumDeposit:money(total*.5),paid:money(paid),balance:money(Math.max(0,total-n(paid)))};
  }

  function productionPriority(a,b){
    const rank=x=>x.kind==='order'?(x.paid?0:1):(x.kind==='portfolio'?2:3);
    const r=rank(a)-rank(b); if(r)return r;
    return String(a.eventDate||'9999-12-31').localeCompare(String(b.eventDate||'9999-12-31'))||String(a.createdAt||'').localeCompare(String(b.createdAt||''));
  }

  function monthlySummary(state,month){
    const rows=(state.cash||[]).filter(x=>String(x.date||'').slice(0,7)===month);
    const income=rows.filter(x=>x.type==='in').reduce((a,x)=>a+n(x.amount),0);
    const expenses=rows.filter(x=>x.type==='out').reduce((a,x)=>a+n(x.amount),0);
    const receivables=(state.orders||[]).filter(x=>x.status!=='Entregue'&&x.status!=='Cancelado').reduce((a,x)=>a+Math.max(0,n(x.total)-n(x.paid)),0);
    return {income:money(income),expenses:money(expenses),net:money(income-expenses),receivables:money(receivables)};
  }

  const starterProducts=[
    ['Chaveiro com nome','Festa infantil e lembrancinha',10,25,.15,1],['Tag personalizada','Chá de bebê e casamento',5,15,.10,.8],['Caixinha temática','Doces e brindes',30,105,1.2,1.5],['Topo de bolo com nome','Aniversário',20,75,.8,2],['Litofania','Presente e casamento',40,210,.5,2],['Bicho articulado','Festa e feira',25,105,.2,1]
  ];
  const starterPosts=['Apresentação da marca','Timelapse da primeira impressão','Chaveiro personalizado','Como nasce uma peça','Litofania acendendo','5 ideias para chá de bebê','Topo de bolo','Quem faz a Lamelle','Como encomendar','Bicho articulado saindo da impressora','3 erros ao escolher a lembrancinha','Peça-destaque do mês'];

function editSimple(area,id){const x=id?find(area,id):{},cfg={inventory:[['name','Nome'],['type','Tipo','select','Filamento|Insumo|Embalagem'],['category','Categoria'],['color','Cor'],['quantity','Quantidade','number'],['minimum','Estoque mínimo','number'],['unit','Unidade'],['unitCost','Custo unitário','number']],clients:[['name','Nome'],['phone','Telefone'],['email','E-mail','email'],['instagram','Instagram'],['notes','Notas','textarea']],content:[['title','Pauta'],['week','Semana','number'],['format','Formato','select','Foto|Reels|Carrossel|Stories'],['cta','CTA'],['publishDate','Data','date'],['status','Status','select','Ideia|Produzindo|Agendado|Publicado'],['reach','Alcance','number'],['saves','Salvamentos','number'],['directs','Directs','number']],partners:[['name','Nome'],['type','Tipo','select','Buffet infantil|Doceria|Cerimonialista|Loja de festa|Fotógrafo|Outro'],['contact','Contato'],['status','Status','select','A visitar|Visitado|Amostra entregue|Parceria ativa|Sem interesse'],['lastContact','Último contato','date'],['notes','Notas','textarea']],cash:[['date','Data','date'],['type','Tipo','select','in|out'],['category','Categoria'],['description','Descrição'],['amount','Valor','number']],production:[['name','Trabalho'],['kind','Tipo','select','order|portfolio|stock'],['eventDate','Data do evento','date'],['quantity','Quantidade','number'],['hours','Horas previstas','number'],['status','Status','select','Planejado|Imprimindo|Pausado|Concluído|Cancelado'],['failures','Falhas','number'],['paid','Pedido com sinal?','select','true|false']]}[area];const html='<div class="fields">'+cfg.map(([n,l,t='text',o=''])=>field(n,l,x[n]??(n==='date'?today():''),t,t==='textarea',o)).join('')+'</div>';openModal((id?'Editar ':'Novo ')+({inventory:'item',clients:'cliente',content:'conteúdo',partners:'parceiro',cash:'lançamento',production:'trabalho'}[area]),html,fd=>{const v=values(fd);cfg.filter(z=>z[2]==='number').forEach(z=>v[z[0]]=num(v[z[0]]));if('paid'in v)v.paid=v.pa function editProduct(id){const p=id?find('products',id):{active:true,multiplier:state.settings.defaultMultiplier,workMinutes:10};const html='<div class="fields">'+field('name','Nome',p.name)+field('occasion','Ocasião',p.occasion)+field('grams','Gramas',p.grams,'number')+field('printMinutes','Minutos de impressão',p.printMinutes,'number')+field('workMinutes','Minutos do seu trabalho',p.workMinutes,'number')+field('supplies','Insumos',p.supplies,'number')+field('packaging','Embalagem',p.packaging,'number')+field('multiplier','Multiplicador',p.multiplier,'number')+field('license','Licença do modelo',p.license,'text',true)+field('active','No catálogo',String(p.active),'select',false,'true|false')+'</div>';openModal(id?'Editar produto':'Novo produto',html,fd=>{const v=values(fd);['grams','printMinutes','workMinutes','supplies','packaging','multiplier'].forEach(k=>v[k]=num(v[k]));v.active=v.active==='true';Object.assign(p,v);if(!id){p.id=C.uid('prod');state.products.push(p)}commit('Produto salvo')})}
function orderLines(items=[]){return `<div id="orderLines">${(items.length?items:[{}]).map((i,k)=>line(i,k)).join('')}</div><button type="button" class="btn secondary" id="addLine" style="margin-top:10px">+ Item</button>`}function line(i,k){return `<div class="order-line"><div class="field product"><label>Produto</label><select name="productId">${state.products.filter(p=>p.active).map(p=>`<option value="${p.id}" ${p.id===i.productId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>${field('quantity','Qtd.',i.quantity||1,'number')}${field('individualized','Nomes diferentes?',String(!!i.individualized),'select',false,'false|true')}<button type="button" class="iconbtn removeLine">✕</button></div>`}
function editOrder(id){const o=id?find('orders',id):{status:'Orçamento enviado',items:[],paid:0,eventDate:'',deliveryDate:''};const html='<div class="fields">'+field('clientName','Cliente',o.clientName)+field('phone','Telefone',o.phone)+field('eventDate','Data do evento',o.eventDate,'date')+field('deliveryDate','Data de entrega',o.deliveryDate,'date')+field('status','Status',o.status,'select',false,'Orçamento enviado|Aguardando sinal|Em produção|Pronto|Entregue|Cancelado')+field('paid','Valor já pago',o.paid,'number')+field('notes','Tema, cor, nome e observações',o.notes,'textarea',true)+'</div><div class="notice"><b>Itens do pedido</b><br>Desconto automático: 10% a partir de 10, 15% a partir de 30 e 20% a partir de 60 peças idênticas. Nomes diferentes não recebem desconto.</div>'+orderLines(o.items);openModal(id?'Editar pedido':'Novo pedido',html,fd=>{const v=values(fd),lines=[...$('#orderLines').children].map(row=>{const pid=row.querySelector('[name=productId]').value,p=find('products',pid),calc=productCalc(p);return {productId:pid,name:p.name,quantity:num(row.querySelector('[name=quantity]').value),individualized:row.querySelector('[name=individualized]').value==='true',unitPrice:calc.salePrice,unitCost:calc.totalCost}}).filter(i=>i.quantity>0);if(!v.clientName.trim())throw Error('Informe o nome do cliente.');const existing=state.clients.find(c=>c.name.toLowerCase()===v.clientName.trim().toLowerCase());const client=existing||{id:C.uid('cli'),name:v.clientName.trim(),phone:v.phone||'',email:'',instagram:'',notes:'Criado pelo pedido'};if(!existing)state.clients.push(client);Object.assign(o,v,{clientId:client.id,clientName:client.name,items:lines,paid:num(v.paid)});const t=C.orderTotals(lines,o.paid);Object.assign(o,t);if(!id){o.id=C.uid('ped');o.code='LAM-'+String(state.orders.length+1).padStart(4,'0');o.createdAt=new Date().toISOString();state.orders.push(o)}commit('Pedido salvo')});setTimeout(()=>{$('#addLine').onclick=()=>$('#orderLines').insertAdjacentHTML('beforeend',line({},Date.now()));$('#orderLines').onclick=e=>{if(e.target.classList.contains('removeLine')&&$('#orderLines').children.length>1)e.target.closest('.order-line').remove()}},0)}
function stockMove(id){const i=find('inventory',id);openModal('Movimentar estoque','<div class="fields">'+field('direction','Movimento','in','select',false,'in|out')+field('quantity','Quantidade',0,'number')+field('reason','Motivo','')+'</div>',fd=>{const v=values(fd),q=num(v.quantity);if(q<=0)throw Error('Informe uma quantidade positiva.');i.quantity=Math.max(0,num(i.quantity)+(v.direction==='in'?q:-q));commit('Estoque atualizado')})}
function receive(id){const o=find('orders',id);openModal('Receber pagamento','<div class="notice">Saldo atual: <b>'+brl(o.balance)+'</b></div><div class="fields">'+field('amount','Valor recebido',o.balance,'number')+field('date','Data',today(),'date')+field('method','Forma','Pix','select',false,'Pix|Dinheiro|Cartão|Transferência')+'</div>',fd=>{const v=values(fd),amount=Math.min(num(v.amount),o.balance);if(amount<=0)throw Error('Informe um valor.');o.paid=C.money(num(o.paid)+amount);const t=orderCalc(o);o.balance=t.balance;state.cash.push({id:C.uid('cai'),date:v.date,type:'in',category:'Pedido',description:`Recebimento ${o.code} · ${o.clientName} · ${v.method}`,amount,orderId:o.id});commit('Pagamento registrado')})}
function remove(area,id){if(!confirm('Excluir este registro? Esta ação não pode ser desfeita.'))return;state[area]=state[area].filter(x=>x.id!==id);commit('Registro excluído')}
function download(name,type,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportJSON(){download(`lamelle-backup-${today()}.json`,'application/json',JSON.stringify(state,null,2))}function importJSON(file){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);Store.replace(x);toast('Backup importado')}catch(e){alert('Não foi possível importar: '+e.message)}};r.readAsText(file)}function exportCSV(){const sets={produtos:state.products,estoque:state.inventory,clientes:state.clients,pedidos:state.orders.map(o=>({...o,items:JSON.stringify(o.items)})),producao:state.production,conteudo:state.content,parceiros:state.partners,caixa:state.cash};Object.entries(sets).forEach(([n,r],i)=>setTimeout(()=>download(`lamelle-${n}-${today()}.csv`,'text/csv;charset=utf-8',C.toCSV(r)),i*180))}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.page){page=t.dataset.page;render()}if(t.dataset.go){page=t.dataset.go;render()}const a=t.dataset.action;if(a==='add-product')editProduct();if(a==='add-inventory')editSimple('inventory');if(a==='add-client')editSimple('clients');if(a==='add-order')editOrder();if(a==='add-job')editSimple('production');if(a==='add-content')editSimple('content');if(a==='add-partner')editSimple('partners');if(a==='add-cash')editSimple('cash');if(a==='export-json')exportJSON();if(a==='import-json')$('#importFile').click();if(a==='export-all-csv')exportCSV();if(a==='save-settings'){document.querySelectorAll('[data-setting]').forEach(i=>state.settings[i.dataset.setting]=num(i.value));commit('Ajustes salvos')}if(a==='reset-data'&&confirm('Restaurar os dados iniciais? Exporte um backup antes de continuar.')){state=C.createInitialState();commit('Painel restaurado')}if(t.dataset.edit){const ar=t.dataset.edit;ar==='products'?editProduct(t.dataset.id):ar==='orders'?editOrder(t.dataset.id):editSimple(ar,t.dataset.id)}if(t.dataset.del)remove(t.dataset.del,t.dataset.id);if(t.dataset.stock)stockMove(t.dataset.stock);if(t.dataset.receive)receive(t.dataset.receive)});$('#importFile').onchange=e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value=''};render();
})();
</script></body></html>
